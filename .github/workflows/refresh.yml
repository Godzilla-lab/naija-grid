name: refresh

on:
  schedule:
    # 07:00 UTC on the 1st and 3rd of every month. NERC usually posts new orders in the first week.
    - cron: "0 7 1,3 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to fetch as YYYY-MM (blank means the current and previous month)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    # macOS: scanned orders and images are read with Apple's Vision framework.
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      # Optional: set both repository secrets to push each new month to Kaggle as well.
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-ocr.txt pytest==9.1.1

      - name: OCR self-test (reads a known scanned page from scratch)
        run: python scripts/ocr_selftest.py

      - name: Download new NERC cap orders (PDF, JPG, PNG or ZIP)
        env:
          MONTH: ${{ github.event.inputs.month }}
        run: |
          if [ -n "$MONTH" ]; then
            python scripts/nerc_caps.py --month "$MONTH"
          else
            CUR=$(date -u +%Y-%m)
            PREV=$(date -u -v-1m +%Y-%m)
            python scripts/nerc_caps.py --from "$PREV" --to "$CUR"
          fi

      - name: Extract every order (scans and images are recognised; known pages reuse raw/ocr_text)
        run: python scripts/reparse.py

      - name: State regulators' caps (Lagos LASERC, Enugu EERC)
        run: python scripts/state_caps.py

      - name: Rebuild clean tables, rankings and charts
        run: python scripts/analyze.py

      - name: Feeder areas from the latest tariff orders (LASERC text; NERC appendix OCR is committed)
        run: python scripts/feeder_areas.py --download

      - name: Test
        run: python -m pytest -q

      - name: Commit (always, so data/last_checked.json keeps the schedule alive)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data raw docs/charts
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          if git diff --cached --name-only | grep -qv '^data/last_checked.json$'; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi
          git commit -m "data: NERC caps refresh $(date -u +%Y-%m-%d)"
          git push

      - name: Push a new version to Kaggle (only when the data changed)
        if: steps.commit.outputs.data_changed == 'true' && env.KAGGLE_KEY != ''
        run: |
          pip install kaggle==2.2.5
          python scripts/kaggle_package.py --owner "$KAGGLE_USERNAME"
          kaggle datasets version -p build/kaggle -r zip -m "NERC caps refresh $(date -u +%Y-%m-%d)"

      - name: Health check, open an issue if anything looks wrong
        run: |
          python scripts/check_refresh.py > report.md
          if [ -s report.md ]; then
            cat report.md
            gh issue create --title "Refresh needs a look: $(date -u +%Y-%m-%d)" --body-file report.md
          else
            echo "All clear."
          fi

      - name: Open an issue if the refresh failed
        if: failure()
        run: |
          gh issue create --title "Refresh FAILED: $(date -u +%Y-%m-%d)" \
            --body "The scheduled refresh failed at a step. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
